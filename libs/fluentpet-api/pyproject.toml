# Extraction metadata for the FluentPet API client library. Nothing is published from here: the
# source lives in custom_components/fluentpet/fluentpet_api and is mapped into the wheel and sdist
# below. At extraction it moves to src/fluentpet_api in CleverPet/fluentpet-api.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluentpet-api"
version = "0.1.0"
description = "Async Python client for the FluentPet household API and webhooks"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "CleverPet, Inc." }]
requires-python = ">=3.14"
dependencies = ["aiohttp"]
classifiers = [
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/CleverPet/fluentpet-homeassistant"
Issues = "https://github.com/CleverPet/fluentpet-homeassistant/issues"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../../custom_components/fluentpet/fluentpet_api" = "fluentpet_api"

[tool.hatch.build.targets.sdist.force-include]
"../../custom_components/fluentpet/fluentpet_api" = "fluentpet_api"
